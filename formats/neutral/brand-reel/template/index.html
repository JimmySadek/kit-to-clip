<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Brand reel</title>
    <link rel="stylesheet" href="brand.css">
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/CustomEase.min.js"></script>
    <script src="brand-snippets.js"></script>
    <script src="reel-tokens.js"></script>
    <script src="format-config.js"></script>
    <style>
      /* Brand reel (neutral format): every colour, font and curve comes from the pack's --reel-* tokens. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: var(--reel-bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--reel-fg);
              background-color: var(--reel-bg); background-image: var(--reel-bg-image, none); }
      #flash { position: absolute; inset: 0; background: var(--reel-accent); opacity: 0; }
      #stage { position: absolute; }
      .display { font-family: var(--reel-font-display); font-weight: var(--reel-weight-display);
                 text-transform: var(--reel-display-case, none); line-height: var(--reel-display-leading, 1); }
      .body { font-family: var(--reel-font-body); font-weight: var(--reel-weight-body); }
      .label { font-family: var(--reel-font-label); font-weight: var(--reel-weight-label); font-variant-numeric: tabular-nums; }
      .motif { position: absolute; left: 50%; top: 50%; color: var(--reel-accent); }
      .motif svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #headline { position: absolute; left: 0; right: 0; top: 50%; display: flex; flex-wrap: wrap; column-gap: .22em; }
      #headline .w { display: inline-block; white-space: nowrap; }
      #headline .w.accent { color: var(--reel-accent); }
      #stat { position: absolute; left: 0; right: 0; top: 50%; }
      #stat-value { white-space: nowrap; line-height: 1; }
      #stat-rule { height: var(--reel-line); background: var(--reel-accent); border-radius: var(--reel-radius); transform-origin: left center; }
      #stat-label { color: var(--reel-muted); letter-spacing: .02em; }
      #points { position: absolute; left: 0; right: 0; top: 50%; list-style: none; }
      #points li { display: flex; align-items: center; gap: .6em; white-space: nowrap; }
      #points .bullet { position: relative; flex: none; width: .9em; height: .9em; color: var(--reel-accent); }
      #points .bullet svg { width: 100%; height: 100%; display: block; }
      #lockup { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #lockup-row { display: flex; align-items: flex-end; }
      #logo { display: block; }
      #motif-end { position: relative; left: auto; top: auto; flex: none; }
      #tagline { color: var(--reel-muted); text-align: center; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="brand-reel" data-start="0" data-width="__W__" data-height="__H__" data-duration="__DUR__">
      <div id="flash"></div>
      <div id="stage">
        <div id="motif" class="motif"></div>
        <div id="headline" class="display" data-slot="headline">__SLOT_headline__</div>
        <div id="stat">
          <div id="stat-value" class="display" data-slot="stat_value">__SLOT_stat_value__</div>
          <div id="stat-rule"></div>
          <div id="stat-label" class="label" data-slot="stat_label">__SLOT_stat_label__</div>
        </div>
        <ul id="points" class="body" data-slot="points">__SLOT_points__</ul>
        <div id="lockup">
          <div id="lockup-row"><img id="logo" alt="logo"><div id="motif-end" class="motif"></div></div>
          <div id="tagline" class="body" data-slot="tagline">__SLOT_tagline__</div>
        </div>
      </div>
      __MUSIC__
    </div>
    <script>
      (function () {
        const C = window.REEL_FORMAT, R = window.REEL, B = R.brand || {};
        const W = C.canvas[0], H = C.canvas[1], S = C.safe;
        const sw = W - S.left - S.right, sh = H - S.top - S.bottom, unit = Math.min(sw, sh);
        const beat = 60 / C.bpm, b = (n) => n * beat;
        const k = { calm: 1.25, steady: 1, punchy: 0.8 }[R.energy] || 1;
        const E = { in: R.ease("enter"), out: R.ease("exit"), move: R.ease("move") };
        const D = { in: R.dur("enter") * k, out: R.dur("exit") * k, move: R.dur("move") * k };
        const $ = (id) => document.getElementById(id);
        const stage = $("stage");
        Object.assign(stage.style, { left: S.left + "px", top: S.top + "px", width: sw + "px", height: sh + "px" });

        // the brand's motif, in the middle, and small copies as bullets and end-card punctuation
        const motifSVG = (B.motif && B.motif.svg) || '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="currentColor"/></svg>';
        const motif = $("motif"), mSize = unit * 0.46;
        motif.innerHTML = motifSVG;
        Object.assign(motif.style, { width: mSize + "px", height: mSize + "px" });
        for (const li of $("points").children) {
          const d = document.createElement("span"); d.className = "bullet"; d.innerHTML = motifSVG; li.prepend(d);
        }
        const mEnd = $("motif-end"), endSize = unit * 0.16;
        mEnd.innerHTML = motifSVG;
        Object.assign(mEnd.style, { width: endSize + "px", height: endSize + "px", marginLeft: unit * 0.03 + "px" });

        // the logo that suits the background
        const hex = R.token("bg").replace("#", "");
        const lum = hex.length >= 6 ? (0.2126 * parseInt(hex.slice(0, 2), 16) + 0.7152 * parseInt(hex.slice(2, 4), 16) + 0.0722 * parseInt(hex.slice(4, 6), 16)) / 255 : 0;
        const logo = $("logo");
        const logoSrc = B.logo && (lum < 0.5 ? B.logo.onDark : B.logo.onLight);
        if (logoSrc) { logo.src = logoSrc; logo.style.height = unit * 0.24 + "px"; logo.style.maxWidth = sw * 0.72 + "px"; } else { logo.remove(); }

        // headline: one span per word, the last word is the accent
        const hl = $("headline");
        const words = hl.textContent.trim().split(/\s+/);
        hl.innerHTML = words.map((w, i) => `<span class="w${i === words.length - 1 ? " accent" : ""}">${w.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`).join(" ");
        const wordEls = [...hl.querySelectorAll(".w")];

        // sizes: fitted after the brand fonts load (only font sizes change, the timeline does not depend on them)
        const fit = (el, start, min, maxW, maxH) => {
          let s = start; el.style.fontSize = s + "px";
          while (s > min && (el.scrollWidth > maxW + 1 || (maxH && el.scrollHeight > maxH + 1))) { s -= 2; el.style.fontSize = s + "px"; }
        };
        const layout = () => {
          fit(hl, sw * 0.2, sw * 0.06, sw, sh * 0.56);
          fit($("stat-value"), sw * 0.5, sw * 0.12, sw, 0);
          $("stat-label").style.fontSize = Math.round(sw * 0.075) + "px";
          $("stat-rule").style.width = sw * 0.42 + "px";
          $("stat-rule").style.margin = unit * 0.03 + "px 0";
          const pts = $("points"); pts.style.fontSize = Math.round(sw * 0.09) + "px";
          for (const li of pts.children) fit(li, parseFloat(pts.style.fontSize), sw * 0.035, sw, 0);
          pts.style.rowGap = unit * 0.05 + "px";
          const tg = $("tagline"); tg.style.marginTop = unit * 0.06 + "px"; fit(tg, sw * 0.08, sw * 0.035, sw, 0);
        };
        layout();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

        const tl = gsap.timeline({ paused: true });
        gsap.set(["#headline", "#stat", "#points"], { yPercent: -50 });
        gsap.set([motif], { xPercent: -50, yPercent: -50 });
        gsap.set(["#stat", "#points", "#lockup"], { autoAlpha: 0 });

        // 0-2 beats: the motif arrives
        const path = motif.querySelector("path, line, polyline");
        if (C.devices.entrance === "draw" && B.motif && B.motif.kind === "line" && path && path.getTotalLength) {
          const len = path.getTotalLength();
          gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(path, { strokeDashoffset: 0, duration: b(1.5), ease: E.move }, 0);
        } else if (C.devices.entrance === "drop") {
          tl.from(motif, { y: -sh * 0.7, duration: D.in * 1.4, ease: E.in }, 0)
            .to(motif, { scaleY: 0.86, scaleX: 1.08, duration: b(0.15), yoyo: true, repeat: 1, ease: E.move }, D.in * 1.4);
        } else if (C.devices.entrance === "spin") {
          tl.from(motif, { rotation: 180, scale: 0.2, autoAlpha: 0, duration: b(1.5), ease: E.in }, 0);
        } else {
          tl.from(motif, { scale: 0, rotation: -60, duration: b(1.5), ease: E.in }, 0);
        }

        // 2-8 beats: the motif steps aside, the headline arrives word by word
        tl.to(motif, { x: -sw * 0.5 + mSize * 0.14, y: -sh * 0.5 + mSize * 0.14, scale: 0.28, duration: D.move, ease: E.move }, b(2));
        const hFrom = { rise: { yPercent: 60, autoAlpha: 0 }, mask: { clipPath: "inset(0% 0% 100% 0%)", y: 20 },
                        scale: { scale: 1.5, autoAlpha: 0, transformOrigin: "left center" } }[C.devices.headline];
        wordEls.forEach((w, i) => tl.from(w, { ...hFrom, duration: D.in, ease: E.in }, b(2.5 + i * 0.5)));
        tl.to("#headline", { y: -unit * 0.06, autoAlpha: 0, duration: D.out, ease: E.out }, b(7.5));

        // 8-14 beats: the stat counts up over its accent rule
        tl.to("#stat", { autoAlpha: 1, duration: 0.01 }, b(8));
        tl.from("#stat-rule", { scaleX: 0, duration: D.move, ease: E.move }, b(8));
        const sv = $("stat-value"), raw = sv.textContent.trim(), m = raw.match(/^([^\d]*)([\d.,]+)(.*)$/);
        if (m) {
          const target = parseFloat(m[2].replace(/,/g, "")), dec = (m[2].split(".")[1] || "").length, num = { v: 0 };
          sv.textContent = m[1] + (0).toFixed(dec) + m[3];
          tl.to(num, { v: target, duration: b(2.5), ease: E.move,
                       onUpdate: () => { sv.textContent = m[1] + num.v.toFixed(dec) + m[3]; } }, b(8.25));
        } else {
          tl.from(sv, { autoAlpha: 0, y: unit * 0.05, duration: D.in, ease: E.in }, b(8.25));
        }
        tl.from("#stat-label", { autoAlpha: 0, y: unit * 0.03, duration: D.in, ease: E.in }, b(9.5));
        tl.to(motif, { rotation: 90, duration: D.move, ease: E.move }, b(8));
        tl.to("#stat", { autoAlpha: 0, y: -unit * 0.05, duration: D.out, ease: E.out }, b(13.5));

        // 14-19 beats: three points on the beat, each with a motif bullet
        tl.to("#points", { autoAlpha: 1, duration: 0.01 }, b(14));
        [...$("points").children].forEach((li, i) => {
          tl.from(li, { x: -unit * 0.08, autoAlpha: 0, duration: D.in, ease: E.in }, b(14 + i * 1.5));
          tl.from(li.querySelector(".bullet"), { scale: 0, rotation: -90, duration: D.in, ease: E.in }, b(14.1 + i * 1.5));
        });
        tl.to(motif, { rotation: 180, duration: D.move, ease: E.move }, b(14));
        tl.to("#points", { autoAlpha: 0, duration: D.out, ease: E.out }, b(18.75));

        // 19-20 beats: the flurry (calm brands get one soft accent wash instead)
        if (R.energy === "calm") {
          tl.to("#flash", { opacity: 0.35, duration: b(0.5), ease: E.move }, b(19)).to("#flash", { opacity: 0, duration: b(0.5), ease: E.move }, b(19.5));
        } else if (C.devices.flurry === "invert") {
          for (const t of [19, 19.5]) tl.set("#flash", { opacity: 1 }, b(t)).set("#flash", { opacity: 0 }, b(t + 0.25));
        } else {
          tl.to("#root", { backgroundColor: R.token("accent"), duration: b(0.25), ease: E.move }, b(19))
            .to("#root", { backgroundColor: R.token("bg"), duration: b(0.5), ease: E.move }, b(19.5));
        }
        tl.to(motif, { rotation: 360, x: 0, y: 0, scale: 0.6, duration: b(1), ease: E.move }, b(19));
        tl.to(motif, { autoAlpha: 0, scale: 0.12, duration: D.out, ease: E.out }, b(20));

        // 20-24 beats: the lockup; the motif lands as the logo's punctuation
        tl.to("#lockup", { autoAlpha: 1, duration: 0.01 }, b(20));
        if (logoSrc) tl.from(logo, { autoAlpha: 0, scale: 0.9, duration: D.in, ease: E.in }, b(20));
        tl.from(mEnd, { y: -unit * 0.25, autoAlpha: 0, duration: D.in, ease: E.in }, b(20.5))
          .to(mEnd, { scaleY: 0.8, scaleX: 1.12, duration: b(0.12), yoyo: true, repeat: 1, ease: E.move }, b(20.5) + D.in);
        tl.from("#tagline", { autoAlpha: 0, y: unit * 0.03, duration: D.in, ease: E.in }, b(21));
        tl.to({}, { duration: C.duration }, 0);   // the timeline covers the whole slot
        window.__timelines["brand-reel"] = tl;
      })();
    </script>
  </body>
</html>
